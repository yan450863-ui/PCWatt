<style>
:root{color-scheme:light;--paper:#f4f0e6;--ink:#1f2924;--muted:#7c887f;--accent:#0f766e;--line:#e2dacd}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px 'Microsoft YaHei UI',sans-serif;color:var(--ink)}
main{max-width:1060px;margin:56px auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:32px;letter-spacing:-1px;margin:6px 0}p{color:var(--muted);line-height:1.8}.eyebrow{letter-spacing:3px;font-size:11px;color:var(--accent)}
button{font:inherit;border:1px solid var(--line);border-radius:11px;padding:12px 18px;color:var(--ink);background:#fff;cursor:pointer;transition:background .18s,box-shadow .18s,transform .18s}button:hover{box-shadow:0 5px 15px #0f766e12;transform:translateY(-1px)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px;background:#ede7dc;border-radius:15px;margin-bottom:18px}nav button{border-color:transparent;background:transparent}nav button[aria-pressed=true]{background:white;border-color:#d4cbbd;box-shadow:0 2px 7px #263d2710}
.cards{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card{border:1px solid var(--line);border-radius:22px;background:white;padding:26px;position:relative;overflow:hidden;min-height:208px}.money{background:linear-gradient(125deg,#edf7f2,#fcfdfb);border-color:#c3ddd1}.label{font-size:12px;color:#557468}.amount{font-size:56px;font-weight:300;letter-spacing:-2px;margin-top:16px}.unit{font-size:14px;letter-spacing:0;color:var(--muted);margin-left:8px}.art{position:absolute;width:110px;height:110px;right:20px;top:45px}.art svg{width:100%;height:100%}.asset[hidden]{display:none}.fine{font-size:12px;color:var(--muted);margin-top:12px}.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent)}.status i{width:7px;height:7px;border-radius:50%;background:#0f766e}.note{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.badge{font-size:11px;border:1px solid #d9d1c4;border-radius:20px;padding:7px 12px;white-space:nowrap;background:#faf7f1}
.strip{margin-top:18px;border:1px solid var(--line);border-radius:22px;padding:24px;background:#fff}.strip svg{width:100%;height:110px}.paused button{transition:none;transform:none}footer{font-size:12px;color:var(--muted);margin-top:22px}
@media(max-width:680px){main{margin:24px auto;padding:0 16px}.cards{grid-template-columns:1fr}.art{width:90px;height:90px}h1{font-size:25px}.note{align-items:start;flex-direction:column}}
</style>

<footer>这是动效设计预览，不连接硬件、不读取用户记录。应用使用同一套 SVG，由 WPF 播放，无浏览器常驻进程。</footer></main>
<script>
let enabled=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function sync(){
 const active=enabled&&!document.hidden&&document.hasFocus()&&!reduced.matches;
 document.body.classList.toggle('paused',!active);
 document.querySelectorAll('svg').forEach(svg=>{
   const owner=svg.closest('.asset');
   if(active&&(!owner||!owner.hidden))svg.unpauseAnimations();else svg.pauseAnimations();
 });
 document.getElementById('state').textContent=active?'前台播放':'动效已停止';
 document.getElementById('toggle').textContent=enabled?'暂停动效':'开启动效';
}
document.getElementById('toggle').addEventListener('click',()=>{enabled=!enabled;sync()});
document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 document.querySelectorAll('.asset').forEach(a=>a.hidden=a.dataset.asset!==button.dataset.kind);
 document.getElementById('power-label').textContent=button.textContent+'功率';sync();
}));
document.addEventListener('visibilitychange',sync);window.addEventListener('focus',sync);window.addEventListener('blur',sync);reduced.addEventListener('change',sync);sync();
</script></html>
